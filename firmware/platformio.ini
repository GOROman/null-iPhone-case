[env:paperdiy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts = pre:tools/muse_asset.py
board_build.embed_files =
    assets/null_regular_24.vlw
    assets/null_regular_30.vlw
    assets/null_regular_36.vlw
board_build.partitions = partitions.csv
lib_deps =
    m5stack/M5GFX@0.3.0
    m5stack/M5Unified@0.3.0
    h2zero/NimBLE-Arduino@2.3.7
