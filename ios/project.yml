name: NullPaper
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NullPaper:
    type: application
    platform: iOS
    sources: [NullPaper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goroman.nullpaper
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NULL PAPER
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 写真やQRコードをケースの電子ペーパーに送信します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  NullPaperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NullPaperTests]
    dependencies:
      - target: NullPaper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goroman.nullpaper.tests
schemes:
  NullPaper:
    build:
      targets:
        NullPaper: all
    test:
      targets: [NullPaperTests]
